[package]
name = "mirach-harness"
version = "0.1.0"
description = "Mirach harness — layout testbed Tauri shell"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri-plugin-dialog = "2"
# features 与主工程一致（unstable），最大化复用 cargo 缓存
tauri = { version = "2", features = ["unstable", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
base64 = "0.22"

# pi SDK 集成第 1 步（docs/pi-integration.md §7-1）：path 引 G 盘仓库；
# default-features=false 去 TUI 栈；nightly 钉版见 rust-toolchain.toml
pi = { package = "pi_agent_rust", path = "G:/pi_agent_rust-main", default-features = false, features = ["sqlite-sessions"] }
asupersync = "0.5"
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
tokio = { version = "1", features = ["sync", "time", "net", "macros"] }
serde_json = "1"
tokio-stream = "0.1"
# ExtensionUiHandler 是 #[async_trait] trait（pi extension_dispatcher），
# impl 侧必须同宏展开签名（E0195 实证）
async-trait = "0.1"
