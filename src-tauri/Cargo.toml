[package]
name = "mirach-harness"
version = "0.1.11"
description = "Mirach harness — layout testbed Tauri shell"
edition = "2021"

[build-dependencies]
tauri-build = { version = "3.0.0-alpha.4", features = [] }

[dependencies]
tauri-plugin-dialog = "3.0.0-alpha.4"
# 软件内更新（2026-11-27 用户："能进行软件内更新推送吗"）：GitHub Releases
# 的 latest.json + minisign 签名；v0.1.5 起安装版可自查自装。
tauri-plugin-updater = "3.0.0-alpha.3"
# 更新安装完成后重启应用（updater 官方配套）。
tauri-plugin-process = "3.0.0-alpha.3"
# features 与主工程一致（unstable），最大化复用 cargo 缓存
tauri = { version = "3.0.0-alpha.6", features = ["unstable", "tray-icon"] }
# v3 alpha：webview 后端外置成 runtime crate——Builder 必须显式选运行时
# （默认 DynRuntime 无属性即 RuntimeNotConfigured）。后端 = 官方 wry
# （Windows 上即 WebView2）。
tauri-runtime-wry = "3.0.0-alpha.6"
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
# 宿主侧托管群聊（hosted_rooms）：事件日志 + 9 张表。版本与 rpi 同源
# （pi-rust-main/Cargo.toml 的 workspace 依赖 0.31 + bundled），复用同一份
# cargo 缓存与 SQLite 编译产物；不引入 sqlx（rpi 全仓零使用）。
rusqlite = { version = "0.31", features = ["bundled"] }
# 执行策略签名 / grant HMAC / 各类 digest
sha2 = "0.10"

# pi SDK 集成（2026-11-14 单引擎定稿）：pi_agent_rust vendored 依赖与
# vendor/ 目录已整体删除（历史存档 = git df701a4 前后各提交；上游真源
# G:\pi_agent_rust-main 未进 git）。同步上游的脱敏补丁、session_index.rs
# .read(true) 补丁随之一并退休（v0.6.0 上游已修 gh #239）。
# 引擎 = rpi-main 工作区（路径依赖，无 nightly 钉版需求）
rpi-cli = { path = "../../pi-rust-main/crates/rpi-cli" }
rpi-agent = { path = "../../pi-rust-main/crates/rpi-agent" }
rpi-ai = { path = "../../pi-rust-main/crates/rpi-ai" }
rpi-harness = { path = "../../pi-rust-main/crates/rpi-harness" }
rpi-tools = { path = "../../pi-rust-main/crates/rpi-tools" }
# 扩展命令面（pi_run_command）：宿主直接调已注册的 slash command（/plan
# start|exit 等），与 rpi-cli RPC 的 execute_command 同一套 handler 契约。
rpi-extensions = { path = "../../pi-rust-main/crates/rpi-extensions" }
rpi-plugin-sdk = { path = "../../pi-rust-main/crates/rpi-plugin-sdk" }
# 应用级偏好（app_prefs.rs）：保持电脑唤醒 = SetThreadExecutionState
# （Win32_System_Power）。只取这一个 feature，避免把整个 win32 元数据拖进来。
# GDI 屏幕捕获（pi_display.rs）：Graphics_Gdi + WindowsAndMessaging（GetSystemMetrics）
# + Foundation（HWND/BOOL 基础类型）。
windows-sys = { version = "0.59", features = [
    "Win32_System_Power",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
] }
# 屏幕缩略图/单帧编码（pi_display.rs）+ petdex spritesheet 首帧（pi_pet.rs，webp）。
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
tokio = { version = "1", features = ["sync", "time", "net", "macros"] }
serde_json = "1"
tokio-stream = "0.1"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# ExtensionUiHandler 是 #[async_trait] trait（pi extension_dispatcher），
# impl 侧必须同宏展开签名（E0195 实证）
async-trait = "0.1"
# 终端 PTY（terminal.rs）：ConPTY/Unix 全跨——pi SDK 无 PTY 面，宿主自建
portable-pty = "0.8"
# 终端 http 链接投放（terminal_open_url）：系统默认浏览器
open = "5"
# 设置页「通知」的 OS 通道（notify_test 命令；Windows = winrt toast）
notify-rust = "4"
# 设置页「密码与登录」的本机加密存储（hermes vault local source 同语义：
# 条目密码进 OS 凭据管理器——Windows = Credential Manager）。
# **必须显式启用平台后端**：keyring 3 没有默认特性，裸 `keyring = "3"` 会
# 退化成进程内 mock store（set 静默不落盘、get 恒 NoEntry）——2026-11-18
# 实测踩中（vault 与连接 token 曾因此假成功）。
keyring = { version = "3", features = ["windows-native"] }
# 定时任务（pi_cron.rs）：调度时刻计算（cron 表达式逐分钟匹配、间隔锚定、
# 一次性时间戳）。chrono 本来就在依赖树里（via notify-rust/iana-time-zone），
# 这里显式声明才能直接 use——**不引新 crate**，lock 不变。
# clock 是 chrono 的默认 feature（Local::now），显式写出来是因为我们真的依赖它。
chrono = { version = "0.4", features = ["clock", "serde"] }
# 定时任务的作业 id / 执行 id（pi_cron.rs）。uuid 也在 pi 的依赖树里
# （vendor Cargo.toml:334，features= ["v4"]），lock 不变。
uuid = { version = "1", features = ["v4"] }
